<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Планер</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#F3F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="src/styles.css">
<link rel="stylesheet" href="src/sync.css">
<link rel="stylesheet" href="src/web.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i></i><span>Планер</span></div>
    <nav id="nav"></nav>
    <div class="side-foot"><button type="button" class="sync" data-sync data-act="syncMenu" data-s="busy"><b></b><span>Подключаюсь…</span></button><button type="button" class="linkish" data-act="importFile">Загрузить данные из файла…</button></div>
  </aside>
  <main id="main"><div class="wrap"><p class="empty">Загрузка…</p></div></main>
</div>
<nav class="tabbar" aria-label="Разделы"><button type="button" data-act="go" data-v="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg><span>Обзор</span></button><button type="button" data-act="go" data-v="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="1"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Календарь</span></button><button type="button" data-act="go" data-v="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span>Задачи</span></button><button type="button" data-act="go" data-v="finance"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="1"/><path d="M3 10h18M16 15h2"/></svg><span>Финансы</span></button><button type="button" data-act="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg><span>Ещё</span></button></nav>
<div class="sheet" id="sheet" hidden>
  <button type="button" data-act="go" data-v="loans">Кредиты</button><button type="button" data-act="go" data-v="goals">Цели</button>
  <button type="button" data-act="go" data-v="habits">Привычки</button><button type="button" data-act="go" data-v="notes">Заметки</button>
  <div class="sheet-foot"><button type="button" class="sync" data-sync data-act="syncMenu" data-s="busy"><b></b><span>Подключаюсь…</span></button><button type="button" class="linkish" data-act="importFile">Загрузить из файла</button></div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="src/sync.js"></script>
<script src="src/calc.js"></script>
<script src="src/web.js"></script>
<script src="src/views-money.js"></script>
<script src="src/app.js"></script>
</body>
</html>
